name: Rust Release

on:
  # https://docs.github.com/en/developers/webhooks-and-events/webhook-events-and-payloads#release
  # The Bump Version workflow will make a Github release if it isn't a prerelease version
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the release without publishing, to check the crates.io Trusted Publishing config"
        type: boolean
        default: false

jobs:
  rust-release:
    uses: IronCoreLabs/workflows/.github/workflows/rust-release.yaml@rust-release-v2.0.0
    with:
      # inputs is empty on release events, and '' fails dry_run's boolean type check.
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
